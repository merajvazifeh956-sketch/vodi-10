# VodiWalker Panel on Fly.io (RVG-style)
# app name must be unique - panel URL: https://APP.fly.dev
app = "vodiwalker-arvin"
primary_region = "fra"

[env]
DATA_DIR = "/data"
PORT = "8080"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 8080
min_machines_running = 1

[[mounts]]
destination = "/data"
source = "data"

[[vm]]
memory = "512mb"
size = "shared-cpu-1x"
